# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - crmcustomertouch
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: npm install and build
        run: |
          npm install
          npm run build
      - name: Add compression server and precompress assets
        run: |
          node azure/compress.js dist
          cp azure/server.js azure/package.json dist/
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/        # <-- solo sube la carpeta dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'crmcustomertouch'
          slot-name: 'Production'
          package: .         # sube el contenido descargado (que es dist/)
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1DE6174C99C2483AABBC34735AAF3494 }}
